function DemoHint({step}){
  const [open,setOpen]=useState(false);
  if(!step) return null;
  return (
    <span style={{position:'relative',display:'flex',flexShrink:0}}
      onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)}>
      <button aria-label="Demo step" style={{width:24,height:24,borderRadius:'50%',padding:0,
        border:`1px solid ${C.line}`,background:'#fff',color:C.mute,cursor:'help',
        display:'flex',alignItems:'center',justifyContent:'center'}}><I.info/></button>
      {open &&
        <div className="fade" style={{position:'absolute',top:'calc(100% + 9px)',left:'50%',
          transform:'translateX(-50%)',width:308,background:'#1B1B23',color:'#fff',borderRadius:10,
          padding:'13px 15px',zIndex:90,boxShadow:'0 12px 34px rgba(20,20,40,.28)'}}>
          <div style={{fontSize:10.5,fontWeight:700,letterSpacing:'.07em',color:'#A9A9FF',marginBottom:7}}>{step.tag}</div>
          <div style={{fontSize:12.5,lineHeight:1.55}}>{step.what}</div>
          <div style={{fontSize:12,lineHeight:1.5,color:'#C9C9D4',marginTop:9,paddingTop:9,
            borderTop:'1px solid rgba(255,255,255,.15)'}}>
            <strong style={{color:'#fff',fontWeight:600}}>Next:</strong> {step.next}</div>
        </div>}
    </span>
  );
}

function StatusBadge({s, size='sm'}){
  const cfg = STATUS[s]; if(!cfg) return null;
  const f = size==='sm' ? 11.5 : 12.5;
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:f,color:C.sub,whiteSpace:'nowrap'}}>
    <span style={{width:6,height:6,borderRadius:'50%',background:cfg.dot,flexShrink:0}}/>{cfg.label}
  </span>;
}

function Btn({children, kind='ghost', sm, onClick, disabled, style}){
  const base = {display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:6,
    fontSize:sm?11.5:12.5,fontWeight:500,letterSpacing:'.03em',cursor:disabled?'not-allowed':'pointer',
    padding:sm?'6px 12px':'9px 16px',transition:'background .12s,border-color .12s',whiteSpace:'nowrap'};
  const kinds = {
    primary:{background:disabled?'#E4E4EA':C.indigo,color:disabled?'#A9A9B4':'#fff',border:'1px solid transparent'},
    outline:{background:'#fff',color:disabled?'#A9A9B4':C.indigo,border:`1px solid ${disabled?'#E4E4EA':'#C9C9F5'}`},
    ghost:  {background:'#fff',color:C.sub,border:`1px solid ${C.line}`},
    danger: {background:'#fff',color:C.red,border:`1px solid ${C.line}`},
  };
  return <button onClick={disabled?undefined:onClick} disabled={disabled} style={{...base,...kinds[kind],...style}}>{children}</button>;
}

function Section({icon, iconColor, title, badge, badgeBg, badgeColor, open, onToggle, danger, children, chevron='auto'}){
  return (
    <div style={{border:`1px solid ${danger&&open?C.red:C.line}`,borderRadius:10,background:'#fff',overflow:'hidden'}}>
      <button onClick={onToggle} style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'13px 14px',
        background:'none',border:'none',cursor:'pointer',textAlign:'left'}}>
        <span style={{color:iconColor,display:'flex',flexShrink:0}}>{icon}</span>
        <span style={{fontSize:13.5,fontWeight:600,color:C.ink,flex:1}}>{title}</span>
        {badge!=null && <span style={{background:badgeBg,color:badgeColor,fontSize:10.5,fontWeight:600,
          padding:'3px 8px',borderRadius:20,whiteSpace:'nowrap'}}>{badge}</span>}
        <span style={{color:C.faint,display:'flex',transform:open?'rotate(0deg)':'rotate(0deg)'}}>
          {chevron==='none' ? null : (open ? <I.chevDown/> : <I.chevRight/>)}
        </span>
      </button>
      {open && <div style={{padding:'0 14px 14px'}}>{children}</div>}
    </div>
  );
}

function SegBar({done,total}){
  return <div style={{display:'flex',gap:5,marginTop:9}}>
    {Array.from({length:total}).map((_,i)=>
      <div key={i} style={{flex:1,height:5,borderRadius:3,background:i<done?C.indigo:'#E7E7ED'}}/>)}
  </div>;
}

function Pill({label,dot}){
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,background:'#F3F3F7',borderRadius:5,
    padding:'4px 8px',fontSize:11,color:C.sub,fontWeight:500,whiteSpace:'nowrap',flexShrink:0}}>
    {dot && <span style={{width:6,height:6,borderRadius:'50%',background:dot}}/>}{label}
  </span>;
}

/* ═══════════════════ CANVAS ═══════════════════ */
const ST_ICON = {
  done:     <span style={{color:'#9A9AA6'}}><I.check/></span>,
  review:   <span style={{color:C.green}}><I.check/></span>,
  action:   <span style={{color:C.red}}><I.alert/></span>,
  progress: <span style={{color:C.indigo}}><I.info/></span>,
};
const TYPE_ICON = {experiment:<I.sparkle/>,goal:<I.target/>,spec:<I.doc/>,variation:<I.plus/>,
  addgoal:<I.target/>,segment:<I.crosshair/>,traffic:<I.split/>,finish:<I.rocket/>};

function NodeCard({t, plain}){
  const ty = TYPE[t.type];
  const isAction = t.st==='action' && !plain;
  return (
    <div style={{width:NODE_W,height:NODE_H,display:'flex',alignItems:'stretch',background:'#fff',

function TerminalNode({node, label, plain}){
  const ty = TYPE[node.type];
  return (

        <div style={{width:4,background:ty.bar,flexShrink:0}}/>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:10,padding:'10px 11px',minWidth:0}}>
          <div style={{width:30,height:30,borderRadius:8,background:ty.chip,color:ty.ic,display:'flex',

            <div style={{fontSize:11.5,color:C.mute,lineHeight:1.35}}>{node.sub}</div>

function GroupBox({g, plain}){
  const h = gboxH(g);
  const allDone = g.done===g.total;
  return (
    <div style={{position:'absolute',left:g.x,top:g.y}}>
      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9,width:NODE_W+GBOX_PAD*2}}>
        <span style={{width:19,height:19,borderRadius:'50%',background:C.indigo,color:'#fff',fontSize:11,
          fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{g.n}</span>
        <span style={{fontSize:13,fontWeight:600,color:C.ink}}>{g.title}</span>
        {!plain && allDone && <span style={{color:'#9A9AA6',display:'flex'}}><I.check/></span>}
        <span style={{marginLeft:'auto',fontSize:12,color:C.mute,fontVariantNumeric:'tabular-nums'}}>{g.done}/{g.total}</span>
      </div>
      <div style={{width:NODE_W+GBOX_PAD*2,height:h,border:'1.5px dashed #BDBDF0',borderRadius:12,
        padding:GBOX_PAD,display:'flex',flexDirection:'column',gap:NODE_GAP}}>
        {g.tasks.map((t,i)=><NodeCard key={i} t={t} plain={plain}/>)}
      </div>
    </div>
  );
}

function Connectors(){
  const g1=GRAPH.groups[0], g2=GRAPH.groups[1], g3=GRAPH.groups[2], g4=GRAPH.groups[3];
  const bw = NODE_W+GBOX_PAD*2;
  const s = GRAPH.start, f = GRAPH.finish;
  const paths = [
    // start → group 1
    `M ${s.x+NODE_W+30} ${s.y+29+21} C ${s.x+NODE_W+70} ${s.y+50+21}, ${g1.x-40} ${g1.y+60}, ${g1.x-4} ${g1.y+70}`,
    // group 1 → group 2
    `M ${g1.x+bw+4} ${g1.y+29+gboxH(g1)-40} C ${g1.x+bw+45} ${g1.y+gboxH(g1)}, ${g2.x-45} ${g2.y+70}, ${g2.x-4} ${g2.y+62}`,
    // group 2 → group 3 (down)
    `M ${g2.x+bw/2+40} ${g2.y+29+gboxH(g2)+4} L ${g2.x+bw/2+40} ${g3.y-6}`,
    // group 3 → group 4
    `M ${g3.x-4} ${g3.y+29+110} C ${g3.x-45} ${g3.y+140}, ${g4.x+bw+45} ${g4.y+130}, ${g4.x+bw+4} ${g4.y+120}`,
    // group 4 → finish
    `M ${g4.x-4} ${g4.y+29+150} C ${g4.x-45} ${g4.y+185}, ${f.x+NODE_W+70} ${f.y+60}, ${f.x+NODE_W+34} ${f.y+48}`,
  ];
  return (
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'visible'}}>
      <defs>
        <marker id="cArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9" fill="none" stroke="#B9B9C6" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        </marker>
      </defs>
      {paths.map((d,i)=><path key={i} d={d} fill="none" stroke="#C9C9D4" strokeWidth="1.5" markerEnd="url(#cArrow)"/>)}
    </svg>
  );
}

function CanvasStage({plain}){
  return (
    <div style={{position:'relative',width:1180,height:1000}}>
      <Connectors/>
      <TerminalNode node={GRAPH.start} label="START" plain={plain}/>
      <TerminalNode node={GRAPH.finish} label="FINISH" plain={plain}/>
      {GRAPH.groups.map(g=><GroupBox key={g.n} g={g} plain={plain}/>)}
    </div>
  );
}

    action:{c:C.red,   bg:'#FDECEC', icon:<I.alert/>},
    review:{c:C.green, bg:'#E7F7EF', icon:<I.check/>},

    busy:  {c:C.indigo,bg:'#EFEFFB', icon:<I.info/>},
  }[k]);
  return (
    <div onClick={()=>onSelect(a)} style={{display:'flex',background:'#fff',
      border:`1px solid ${selected?C.indigo:C.line}`,borderRadius:10,cursor:'pointer',overflow:'hidden',
      boxShadow:selected?`0 0 0 1px ${C.indigo}`:'0 1px 2px rgba(20,20,40,.04)'}}>

        {a.chips.length>0 &&
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:9}}>
            {a.chips.map((ch,i)=>{const s=chipStyle(ch.k);return(

                fontSize:11.5,padding:'4px 9px',borderRadius:5}}>
                {s.icon && <span style={{display:'flex'}}>{s.icon}</span>}{ch.t}</span>);})}

          <I.repeat/>{a.repeats}</span>}

function AutomationsList({automations,selectedId,onSelect,onNew}){
  const [q,setQ]=useState(''); const [view,setView]=useState('list'); const [filter,setFilter]=useState('all');
  const counts = Object.fromEntries(FILTER_ORDER.map(s=>[s,automations.filter(a=>a.status===s).length]));
  const rows = automations.filter(a=>a.name.toLowerCase().includes(q.toLowerCase()))
                          .filter(a=>filter==='all'||a.status===filter);
  const tab=(key,label,count)=>{
    const on=filter===key;
    return <button key={key} onClick={()=>setFilter(key)} style={{display:'inline-flex',alignItems:'center',gap:7,
      padding:'7px 12px',borderRadius:7,border:'none',cursor:'pointer',background:on?'#EFEFFB':'transparent',
      color:on?C.indigo:C.sub,fontSize:12.5,fontWeight:on?600:400,whiteSpace:'nowrap'}}>
      {label}
      {count!=null && <span style={{background:key==='action_required'&&count>0?C.red:'#EDEDF1',
        color:key==='action_required'&&count>0?'#fff':C.sub,fontSize:10.5,fontWeight:600,minWidth:18,height:18,
        borderRadius:9,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 5px'}}>{count}</span>}
    </button>;
  };
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflowY:'auto',minWidth:540,background:'#fff'}}>
      <div style={{padding:'26px 30px 0'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:20,marginBottom:20}}>
          <div>
            <h1 className="mont" style={{fontSize:26,fontWeight:600,margin:0,letterSpacing:'-.01em'}}>Automations</h1>
            <p style={{fontSize:13.5,color:C.mute,margin:'5px 0 0'}}>Create automated tasks that run on their own</p>
          </div>
          <Btn kind="primary" onClick={onNew} style={{padding:'10px 18px',fontSize:12.5}}>
            <span style={{fontSize:15,lineHeight:1}}>+</span>NEW</Btn>
        </div>
        <div style={{display:'flex',gap:12,marginBottom:16}}>
          <div style={{flex:1,display:'flex',alignItems:'center',gap:9,border:`1px solid ${C.line}`,borderRadius:8,
            padding:'9px 13px',minWidth:0}}>
            <span style={{color:C.faint,display:'flex'}}><I.search/></span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search automations"
              style={{flex:1,border:'none',outline:'none',fontSize:13,color:C.ink,minWidth:0}}/>
          </div>
          <div style={{display:'flex',border:`1px solid ${C.line}`,borderRadius:8,padding:3,gap:2}}>
            {[['list','List',<I.list/>],['kanban','Kanban',<I.kanban/>]].map(([v,l,ic])=>
              <button key={v} onClick={()=>setView(v)} style={{display:'inline-flex',alignItems:'center',gap:7,
                padding:'6px 14px',borderRadius:6,border:'none',cursor:'pointer',
                background:view===v?'#EFEFFB':'transparent',color:view===v?C.indigo:C.sub,fontSize:13,fontWeight:500}}>
                {ic}{l}</button>)}
          </div>
          <button style={{width:42,border:`1px solid ${C.line}`,borderRadius:8,background:'#fff',cursor:'pointer',
            color:C.sub,display:'flex',alignItems:'center',justifyContent:'center'}}><I.filter/></button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:2,marginBottom:18}}>
          {tab('all','All',null)}
          {FILTER_ORDER.map(s=>tab(s,STATUS[s].label,counts[s]))}
        </div>
      </div>
      <div style={{padding:'0 30px 30px',display:'flex',flexDirection:'column',gap:12}}>
        {rows.length===0
          ? <div style={{padding:'60px 0',textAlign:'center',color:C.mute,fontSize:13.5}}>No automations here.</div>
          : view==='list'
            ? rows.map(a=><AutomationCard key={a.id} a={a} selected={selectedId===a.id} onSelect={onSelect}/>)
            : <div style={{display:'flex',gap:14,overflowX:'auto',paddingBottom:8}}>
                {FILTER_ORDER.map(s=>{
                  const col=rows.filter(a=>a.status===s);
                  return <div key={s} style={{minWidth:250,flex:'1 0 250px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                      <span style={{width:7,height:7,borderRadius:'50%',background:STATUS[s].dot}}/>
                      <span style={{fontSize:12.5,fontWeight:500}}>{STATUS[s].label}</span>
                      <span style={{fontSize:12,color:C.mute}}>{col.length}</span>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                      {col.map(a=><AutomationCard key={a.id} a={a} selected={selectedId===a.id} onSelect={onSelect}/>)}
                    </div>
                  </div>;})}
              </div>}
      </div>
    </div>
  );
}

function OverflowMenu({action,onActivity,onClose}){
  const label={pause:['Pause automation',<I.pause/>],run:['Run automation',<I.play/>],repeat:['Repeat automation',<I.repeat/>]}[action];
  const row=(icon,text,danger,onClick)=>(
    <button onClick={onClick} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 12px',
      background:'none',border:'none',cursor:'pointer',fontSize:12.5,color:danger?C.red:C.ink,textAlign:'left'}}
      onMouseOver={e=>e.currentTarget.style.background='#F6F6F9'}
      onMouseOut={e=>e.currentTarget.style.background='transparent'}>
      <span style={{display:'flex',color:danger?C.red:C.sub}}>{icon}</span>{text}</button>);
  return (
    <>
      <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:40}}/>
      <div className="fade" style={{position:'absolute',top:'calc(100% + 6px)',right:0,width:206,background:'#fff',
        border:`1px solid ${C.line}`,borderRadius:9,boxShadow:'0 8px 24px rgba(20,20,40,.12)',zIndex:41,
        padding:'5px 0',overflow:'hidden'}}>
        {row(<I.copy/>,'Duplicate automation',false,onClose)}
        {row(label[1],label[0],false,onClose)}
        {row(<I.history/>,'View activity log',false,()=>{onClose();onActivity();})}
        {row(<I.trash/>,'Delete automation',true,onClose)}
      </div>
    </>
  );
}

          <span style={{color:C.sub,display:'flex'}}><I.history/></span>
          <span className="mont" style={{fontSize:16,fontWeight:600,flex:1}}>Activity log</span>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:C.mute,display:'flex'}}><I.close/></button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
          {ACTIVITY.map((e,i)=>
            <div key={i} style={{display:'flex',gap:12,paddingBottom:i===ACTIVITY.length-1?0:18}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0,paddingTop:4}}>
                <span style={{width:9,height:9,borderRadius:'50%',background:e.c}}/>
                {i<ACTIVITY.length-1 && <span style={{flex:1,width:1,background:C.line,marginTop:4,minHeight:26}}/>}
              </div>

function AssetRow({a, onReview, syncedMode}){
  const done = a.state==='reviewed' || syncedMode;
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderBottom:`1px solid ${C.lineSoft}`}}>
      <Pill label={a.pill} dot={a.dot}/>
      <span style={{flex:1,fontSize:12.5,color:C.ink,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</span>
      {done && <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11.5,color:C.mute,flexShrink:0}}>
        <span style={{color:C.green,display:'flex'}}><I.check/></span>{syncedMode?'Reviewed':'Approved'}</span>}
      {done
        ? <Btn kind="ghost" sm onClick={onReview}>View</Btn>
        : <Btn kind="primary" sm onClick={onReview}>Review</Btn>}
    </div>
  );
}

function DetailPanel({a, onClose, onOpen, onAnswer, onReviewAsset, onSync}){
  const [menu,setMenu]=useState(false); const [log,setLog]=useState(false);
  const [openSec,setOpenSec]=useState({ar:true,fr:false,ip:false,assets:true});
  const tog=k=>setOpenSec(s=>({...s,[k]:!s[k]}));
  const isReview = a.status==='review_results';
  const isSynced = a.status==='synced';
  const assets = (isReview||isSynced) ? (a.forReview||[]) : [];
  const reviewedCount = assets.filter(x=>x.state==='reviewed').length;
  const remaining = assets.length-reviewedCount;
  const allReviewed = assets.length>0 && remaining===0;

  return (
    <div className="fade" style={{width:430,borderLeft:`1px solid ${C.line}`,background:'#fff',display:'flex',
      flexDirection:'column',flexShrink:0,overflowY:'auto'}}>
      <div style={{padding:'16px 20px 0'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,position:'relative'}}>
          <Btn kind="ghost" sm onClick={onOpen} style={{marginLeft:'auto'}}><I.pencil/>OPEN AUTOMATION</Btn>
          <div style={{position:'relative'}}>
            <button onClick={()=>setMenu(m=>!m)} style={{width:30,height:28,border:`1px solid ${C.line}`,borderRadius:6,
              background:'#fff',cursor:'pointer',color:C.sub,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <I.kebab/></button>
            {menu && <OverflowMenu action={a.menuAction} onClose={()=>setMenu(false)} onActivity={()=>setLog(true)}/>}
          </div>
          <button onClick={onClose} style={{width:30,height:28,border:`1px solid ${C.line}`,borderRadius:6,
            background:'#fff',cursor:'pointer',color:C.sub,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <I.close/></button>
        </div>
        <div style={{marginBottom:6}}><StatusBadge s={a.status}/></div>
        <h2 className="mont" style={{fontSize:19,fontWeight:600,margin:'0 0 4px'}}>{a.name}</h2>
        <div style={{fontSize:12.5,color:C.mute,marginBottom:18}}>
          Created by <span style={{color:C.sub,fontWeight:500}}>{a.by}</span> · {a.ago}</div>

        <div style={{fontSize:13,fontWeight:600,color:C.ink,marginBottom:6}}>Description</div>
        <p style={{fontSize:13,color:C.sub,lineHeight:1.55,margin:'0 0 4px'}}>{a.desc}</p>
        <button style={{background:'none',border:'none',padding:0,cursor:'pointer',fontSize:13,fontWeight:500,color:C.indigo}}>Show more</button>

        {a.progress &&
          <div style={{marginTop:20,paddingTop:18,borderTop:`1px solid ${C.lineSoft}`}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Progress</div>
            <div style={{fontSize:12,color:C.mute}}>Task {a.progress.done} of {a.progress.total}</div>
            <div style={{fontSize:13,fontWeight:600,color:C.ink,marginTop:3}}>Currently: {a.progress.current}</div>
            <SegBar done={a.progress.done} total={a.progress.total}/>
          </div>}
      </div>

      <div style={{padding:'20px',display:'flex',flexDirection:'column',gap:11}}>
        {isReview &&
          <div style={{background:'#F2F3FE',border:'1px solid #DEDFFA',borderRadius:10,padding:'14px 16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
              <span style={{color:C.indigo,display:'flex'}}><I.info/></span>
              <span style={{fontSize:12,fontWeight:700,letterSpacing:'.04em',color:C.indigo}}>REVIEW ASSETS &amp; SYNC TO DASHBOARDS</span>
            </div>
            <p style={{fontSize:12.5,color:'#4A4A8A',lineHeight:1.55,margin:0}}>
              Your automation has completed all tasks. You must review and approve all assets in order to sync them to your dashboards and use them in campaigns.
            </p>
          </div>}

        {(isReview||isSynced) &&
          <Section
            icon={<I.check/>} iconColor={C.green}
            title={isSynced?'Synced to dashboards':'For review'}
            badge={isSynced?'All assets synced':`${remaining} assets ready for review`}
            badgeBg={isSynced?'#E7F7EF':'#EFEFFB'} badgeColor={isSynced?C.green:C.indigo}
            open={openSec.assets} onToggle={()=>tog('assets')}>
            <div style={{border:`1px solid ${C.lineSoft}`,borderRadius:8,overflow:'hidden'}}>
              {assets.map(x=><AssetRow key={x.id} a={x} syncedMode={isSynced} onReview={()=>onReviewAsset(a,x)}/>)}
            </div>
          </Section>}

        {isReview &&
          <div>
            <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,color:C.sub,marginBottom:8}}>
              {reviewedCount} of {assets.length} assets reviewed
              <span style={{color:C.faint,display:'flex'}}><I.info/></span>
            </div>
            <div style={{height:5,borderRadius:3,background:'#EDEDF1',overflow:'hidden',marginBottom:7}}>
              <div style={{height:'100%',width:`${reviewedCount/assets.length*100}%`,background:C.indigo,borderRadius:3}}/>
            </div>
            <div style={{fontSize:12,color:C.mute,marginBottom:16}}>{remaining} assets remaining</div>
            <Btn kind="primary" disabled={!allReviewed} onClick={()=>onSync&&onSync(a)}
              style={{width:'100%',padding:'12px'}}>SYNC ASSETS TO DASHBOARDS</Btn>
            <p style={{fontSize:11.5,color:C.mute,textAlign:'center',margin:'10px 0 0',lineHeight:1.5}}>
              All assets must be reviewed in order to approve and sync. {remaining} remaining.</p>
          </div>}

        {isSynced &&
          <div>
            <Btn kind="primary" disabled style={{width:'100%',padding:'12px'}}>
              <I.check/>ASSETS SYNCED TO DASHBOARDS</Btn>
            <p style={{fontSize:11.5,color:C.mute,textAlign:'center',margin:'10px 0 0',lineHeight:1.5}}>
              All assets synced to dashboards. You may now use them in campaigns.</p>
          </div>}

        {openActions(a).length>0 &&
          <Section icon={<I.alert/>} iconColor={C.red} title="Action required"
            badge={`${openActions(a).length} tasks`} badgeBg={C.red} badgeColor="#fff"
            open={openSec.ar} onToggle={()=>tog('ar')} danger>
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              {openActions(a).map(t=>
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:12,background:'#FAFAFC',
                  border:`1px solid ${C.lineSoft}`,borderRadius:8,padding:'11px 13px'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500,color:C.ink,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.title}</div>
                    <div style={{fontSize:11.5,color:C.mute,marginTop:2}}>{t.meta}</div>
                  </div>
                  <Btn kind="outline" sm onClick={()=>onAnswer(a,t)}>Answer</Btn>
                </div>)}
            </div>
          </Section>}

        {!isReview && !isSynced && a.forReview.length>0 &&
          <Section icon={<I.check/>} iconColor={C.green} title="For review"
            badge={`${a.forReview.length} assets`} badgeBg={C.green} badgeColor="#fff"
            open={openSec.fr} onToggle={()=>tog('fr')}>
            <div style={{border:`1px solid ${C.lineSoft}`,borderRadius:8,overflow:'hidden'}}>
              {a.forReview.map(x=>{const done=x.state==='reviewed';return(
                <div key={x.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',
                  borderBottom:`1px solid ${C.lineSoft}`}}>
                  <Pill label={x.pill} dot={x.dot}/>
                  <span style={{flex:1,fontSize:12.5,color:C.ink,minWidth:0}}>{x.name}</span>
                  {done &&
                    <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11.5,color:C.mute}}>
                      <span style={{color:C.green,display:'flex'}}><I.check/></span>Reviewed</span>}
                  {done
                    ? <Btn kind="ghost" sm onClick={()=>onReviewAsset(a,x)}>View</Btn>
                    : <Btn kind="primary" sm onClick={()=>onReviewAsset(a,x)}>Review</Btn>}
                </div>);})}
            </div>
          </Section>}

        {a.inProgress.length>0 &&
          <Section icon={<I.info/>} iconColor={C.indigo} title="In-progress"
            badge={`${a.inProgress.length} tasks`} badgeBg={C.indigo} badgeColor="#fff"
            open={openSec.ip} onToggle={()=>tog('ip')}>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {a.inProgress.map(t=>
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:10}}>
                      <span style={{fontSize:13,color:C.ink}}>{t.name}</span>
                      <span style={{fontSize:11.5,color:C.mute,fontVariantNumeric:'tabular-nums'}}>{t.pct}%</span>
                    </div>
                    <div style={{height:4,borderRadius:3,background:'#EDEDF1',marginTop:6,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${t.pct}%`,background:C.indigo,borderRadius:3}}/>
                    </div>
                  </div>
                  <Btn kind="ghost" sm>View</Btn>
                </div>)}
            </div>
          </Section>}
      </div>
      {log && <ActivityLog onClose={()=>setLog(false)}/>}
    </div>
  );
}

function NewAutomation({onCancel,onBuild}){
  const [name,setName]=useState(''); const [project,setProject]=useState('');

            borderRadius:9,display:'flex',alignItems:'center',gap:10,padding:'0 12px'}}>
            <div style={{width:28,height:28,borderRadius:7,background:'#F0F0F4'}}/>
            <div style={{flex:1}}>
              <div style={{height:7,background:'#F0F0F4',borderRadius:4,marginBottom:6,width:'80%'}}/>

            </div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:14.5,fontWeight:600,color:C.ink,marginBottom:6}}>New automation</div>
            <p style={{fontSize:12.5,color:C.mute,margin:0,maxWidth:300,lineHeight:1.55}}>

          </div>
          <div style={{borderTop:`1px solid ${C.lineSoft}`,paddingTop:18}}/>

          {label('Automation name')}
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Checkout conversion boost"

              fontSize:13,outline:'none',marginBottom:errors.name?0:18}}/>
          {errors.name && err(errors.name)}
          {errors.name && <div style={{height:18}}/>}

          {label('Project')}
          <select value={project} onChange={e=>setProject(e.target.value)}
            style={{width:'100%',padding:'10px 13px',border:`1px solid ${C.line}`,borderRadius:7,fontSize:13,

          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:7}}>
            <span style={{fontSize:13,fontWeight:500,display:'inline-flex',alignItems:'center',gap:6}}>
              Description for AI <span style={{color:C.faint,fontSize:11,border:`1px solid ${C.line}`,
                borderRadius:'50%',width:14,height:14,display:'inline-flex',alignItems:'center',justifyContent:'center'}}>?</span>
            </span>
            <span style={{fontSize:11.5,color:C.mute,fontVariantNumeric:'tabular-nums'}}>{desc.length}/{MAX}</span>
          </div>
          <textarea value={desc} maxLength={MAX} onChange={e=>setDesc(e.target.value)}

                  borderRadius:8,cursor:'pointer',background:when===o.k?'#F5F5FE':'#fff',

                <span style={{color:when===o.k?C.indigo:C.faint,display:'flex',flexShrink:0}}>{o.ic}</span>
                <span style={{minWidth:0}}>
                  <span style={{display:'block',fontSize:12.5,fontWeight:500,color:when===o.k?C.indigo:C.ink}}>{o.t}</span>
                  <span style={{display:'block',fontSize:11,color:when===o.k?C.indigo:C.mute,overflow:'hidden',

            <div>

                <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:10}}>

        <div style={{borderTop:`1px solid ${C.line}`,padding:'14px 22px',display:'flex',justifyContent:'flex-end',gap:10}}>

          <Btn kind="primary" onClick={build}>BUILD <I.arrowRight/></Btn>
        </div>
      </div>
    </div>
  );
}

function CreationThread({draft,phase,answers,setAnswers,onApprove,onRefine,onBack}){
  return (
    <div style={{display:'flex',flexDirection:'column',gap:11}}>
      <ThreadPrompt text={draft.desc}/>

      {phase==='analyzing' &&
        <ThreadLoading title="Analyzing your automation request…" sub="Configuring the ideal list of tasks for your needs"/>}

      {phase==='clarify' &&
        <ThreadCard title="Action required: Automation details needed">
          {CLARIFY.map((q,qi)=>
            <div key={q.k} style={{marginBottom:qi===CLARIFY.length-1?0:15}}>
              <div style={{fontSize:12.5,color:C.sub,marginBottom:8}}>{q.q}</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                {q.opts.map(o=>{const on=answers[q.k]===o;
                  return <button key={o} onClick={()=>setAnswers(a=>({...a,[q.k]:o}))}
                    style={{padding:'6px 12px',borderRadius:6,cursor:'pointer',fontSize:12,
                      background:on?'#F5F5FE':'#fff',color:on?C.indigo:C.sub,fontWeight:on?600:400,
                      border:`1px solid ${on?C.indigo:C.line}`}}>{o}</button>;})}
              </div>
            </div>)}
        </ThreadCard>}

      {(phase==='planning'||phase==='approve'||phase==='done') &&
        <ThreadCollapsed text="Action required: Automation details needed"/>}

      {phase==='planning' && <>
        <ThreadLoading title="Generating an automation plan" sub="Configuring the ideal list of tasks for your needs"/>
        <div style={{display:'flex',gap:10,border:`1px solid ${C.line}`,borderRadius:9,padding:'12px 14px',background:'#FBFBFD'}}>
          <span style={{color:C.indigo,display:'flex',flexShrink:0,marginTop:2}}><I.sparkle/></span>
          <p style={{fontSize:12.5,color:C.sub,lineHeight:1.6,margin:0}}>
            Thanks — that’s everything I need for now. This can take a few minutes, so feel free to head
            back to the dashboard. I’ll let you know there as soon as the plan is ready for your approval.</p>
        </div>
      </>}

      {(phase==='approve'||phase==='done') &&
        <div style={{border:`1px solid ${C.line}`,borderRadius:9,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 13px',borderBottom:`1px solid ${C.lineSoft}`}}>
            <span style={{color:C.sub,display:'flex'}}><I.bulb/></span>
            <span style={{fontSize:12.5,color:C.sub}}>Thought for 11 seconds</span></div>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 13px'}}>
            <span style={{color:C.sub,display:'flex'}}><I.search/></span>
            <span style={{fontSize:12.5,color:C.sub}}>Prepared automation plan for 1minute 27 seconds</span></div>
        </div>}

      {phase==='approve' &&
        <ThreadCard title="Action required: Approve automation plan">
          <div style={{marginBottom:11}}><StatusBadge s="awaiting_approval"/></div>
          <p style={{fontSize:12.5,color:C.sub,lineHeight:1.6,margin:'0 0 10px'}}>
            An automation plan has been configured based on your request. Please review all details and approve or refine.</p>
          <p style={{fontSize:12.5,color:C.sub,lineHeight:1.6,margin:'0 0 10px'}}>
            If you approve, your automation will go live {draft.when==='later'?'at the date and time you’ve scheduled it for':'immediately'}.</p>
          <p style={{fontSize:12.5,color:C.ink,lineHeight:1.6,margin:'0 0 14px'}}>
            <strong>Attention:</strong> An automation cannot be edited once live.</p>
          <div style={{display:'flex',justifyContent:'flex-end',gap:9}}>

            <Btn kind="outline" onClick={onApprove}><I.check/>APPROVE</Btn>
          </div>
        </ThreadCard>}

      {phase==='done' &&
        <>
          <ThreadCollapsed text="Action required: Approve automation plan"/>
          <div style={{border:`1px solid ${C.line}`,borderRadius:9,padding:'14px 15px'}}>
            <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9}}>
              <span style={{color:C.green,display:'flex'}}><I.check/></span>
              <span style={{fontSize:12.5,fontWeight:600,flex:1}}>Your automation has been approved</span>
              <StatusBadge s={draft.when==='later'?'scheduled':'running'}/>

          </div>

const titleFromPrompt = t => {
  /* Prompts open with "Create an experiment to ..."; the automation should be named
     for what it does, not for the instruction that produced it. */
  const w = t.replace(/\s+/g,' ').trim()
    .replace(/^(create|build|make|set ?up|run)\s+(an?\s+)?(experiment|test|automation|workflow)\s+(to|that|which)\s+/i,'')
    .split(/[(,.;]/)[0].trim().split(' ').slice(0,5);
  while(w.length>2 && /^(with|and|for|to|using|that|on|in|the|a|an)$/i.test(w[w.length-1])) w.pop();
  const s2 = w.join(' ');
  return s2.charAt(0).toUpperCase()+s2.slice(1);
};

function App(){
  const [screen,setScreen]=useState('home'); // home | dashboard | new | canvas | editor
  const [automations,setAutomations]=useState(AUTOMATIONS);
  const [selectedId,setSelectedId]=useState('a1');
  const [canvasId,setCanvasId]=useState(null);       // an existing automation opened on the canvas
  const [draft,setDraft]=useState(null);             // the in-flight creation run (form output + row id)
  const [editor,setEditor]=useState(null);           // {aid, itemId, kind}
  const [phase,setPhase]=useState('analyzing');
  const [answers,setAnswers]=useState({});

  const patch=(id,p)=>setAutomations(prev=>prev.map(a=>a.id===id?{...a,...p}:a));
  const selected  = automations.find(a=>a.id===selectedId)||null;
  const canvasFor = automations.find(a=>a.id===canvasId)||null;

  /* The creation run is driven from here, not from CanvasScreen, so that walking away
     mid-generation doesn't unmount the timers and restart the whole thing. */
  useEffect(()=>{ if(!draft||phase!=='analyzing') return;
    const t=setTimeout(()=>setPhase('clarify'),1300); return ()=>clearTimeout(t); },[draft,phase]);
  useEffect(()=>{ if(!draft||phase!=='clarify') return;
    if(CLARIFY.every(q=>answers[q.k])){
      const t=setTimeout(()=>setPhase('planning'),450); return ()=>clearTimeout(t); }},[draft,phase,answers]);
  useEffect(()=>{ if(!draft||phase!=='planning') return;
    const t=setTimeout(()=>{
      setPhase('approve');
      patch(draft.id,{status:'awaiting_approval',chips:[{k:'plan',t:'Automation plan ready'}]});
    },4000);
    return ()=>clearTimeout(t); },[draft,phase]);

  function startCreation(d){
    const id='n'+Date.now(), scheduled=d.when==='later';
    setAutomations(prev=>[{
      id, name:d.name, by:'Paul Tremblay', ago:'Just now',
      status:'draft', bar:'#3838E7', menuAction:'run', desc:d.desc,
      chips:[{k:'busy',t:'Generating automation plan'}],
      when: scheduled?(d.schedule||'Scheduled'):null,
      repeats: d.repeat?`Repeats ${String(d.repeat).toLowerCase()}`:null,
      progress:null, actionRequired:[], forReview:[], inProgress:[],
    },...prev]);
    setDraft({...d,id}); setPhase('analyzing'); setAnswers({});
    setCanvasId(null); setSelectedId(id); setScreen('canvas');
  }

  function approvePlan(){
    if(!draft) return;
    const id=draft.id, live=draft.when==='later'?'scheduled':'running';
    setPhase('done');
    patch(id,{status:live, chips:[],
      progress:{done:1,total:6,current:'Creating variations'},
      inProgress:[{id:id+'-ip1',name:'Creating variations',pct:20}]});
    if(live!=='running') return;
    /* A live automation hits its first clarifications shortly after starting. */
    setTimeout(()=>setAutomations(prev=>prev.map(a=>a.id!==id?a:{...a,
      status:'action_required',
      chips:[{k:'action',t:'2 tasks require action'}],
      progress:{done:2,total:6,current:'Creating variations'},
      actionRequired:[
        {id:id+'-ar1', title:'Approve the express checkout build', meta:'Add variations · just now',
         resolved:false, type:'variation', pill:'Variation 2', dot:'#3838E7', name:'Express checkout'},
        {id:id+'-ar2', title:'Confirm the experiment targeting', meta:'Experiment configuration · just now',
         resolved:false, type:'segment', pill:'Segment', dot:null, name:'New visitors from the USA'},
      ],
      inProgress:[{id:id+'-ip1',name:'Creating variations',pct:45}],
    })),7000);
  }

  /* Leaving the canvas keeps an unfinished run alive; only a finished one is cleared. */
  const leaveCanvas=()=>{ if(phase==='done') setDraft(null); setCanvasId(null); setScreen('dashboard'); };
  const openEditor=(a,item,kind)=>{ setEditor({aid:a.id,itemId:item.id,kind}); setScreen('editor'); };

  function approveItem(it){
    const {aid,kind}=editor;
    const a=automations.find(x=>x.id===aid); if(!a) return;
    const oldQ = kind==='action'?openActions(a):openAssets(a);
    const at = oldQ.findIndex(x=>x.id===it.id);
    const next = kind==='action'
      ? {...a, actionRequired:(a.actionRequired||[]).map(t=>t.id===it.id?{...t,resolved:true}:t)}
      : {...a, forReview:(a.forReview||[]).map(x=>x.id===it.id?{...x,state:'reviewed'}:x)};
    const q = kind==='action'?openActions(next):openAssets(next);
    if(kind==='action'){
      if(q.length){
        next.status='action_required';
        next.chips=[{k:'action',t:`${q.length} task${q.length===1?'':'s'} require action`}];
      } else {
        /* Last action cleared - the run finishes and its assets queue up for sync. */
        next.status='review_results';
        next.chips=[{k:'review',t:'Automation results ready for review'}];
        next.progress=null; next.inProgress=[];
        next.forReview=[
          {id:aid+'-v1', pill:'Variation 1', dot:'#3838E7', name:'Simplified form',  state:'reviewed', type:'variation'},
          {id:aid+'-v2', pill:'Variation 2', dot:'#3838E7', name:'Express checkout', state:'reviewed', type:'variation'},
          {id:aid+'-v3', pill:'Variation 3', dot:'#E08C36', name:'Trust badges',     state:'reviewed', type:'variation'},
          {id:aid+'-s1', pill:'Segment', dot:null, name:'New visitors from the USA', state:'reviewed', type:'segment'},
          {id:aid+'-g1', pill:'Goal',    dot:null, name:'Checkout button clicks',    state:'reviewed', type:'goal'},
        ];
      }
    }
    setAutomations(prev=>prev.map(x=>x.id===aid?next:x));
    const follow = q[Math.min(at,q.length-1)];
    if(follow) setEditor(e=>({...e,itemId:follow.id}));
  }

  const syncAssets=a=>patch(a.id,{status:'synced',chips:[]});

  const edAuto = editor ? automations.find(x=>x.id===editor.aid) : null;
  const edItem = edAuto ? findItem(edAuto,editor.itemId) : null;

  /* Which of the seven demo screens we are standing on. */
  let hint=null;
  if(screen==='home'||screen==='new') hint=DEMO.prompt;
  else if(screen==='canvas') hint = canvasId
    ? (canvasFor && openActions(canvasFor).length ? DEMO.pending : null)
    : (phase==='approve'?DEMO.approve : phase==='done'?DEMO.started : DEMO.building);
  else if(screen==='editor') hint = (edItem && edItem.type==='segment') ? DEMO.target : DEMO.build;
  else hint = selected && selected.status==='review_results' ? DEMO.sync
            : selected && openActions(selected).length ? DEMO.pending
            : DEMO.kanban;

  if(screen==='canvas' && (canvasFor||draft))
    return <CanvasScreen mode={canvasId?'open':'create'} automation={canvasFor} draft={draft}
      phase={phase} answers={answers} setAnswers={setAnswers} hint={hint}
      onApprove={approvePlan} onRefine={()=>setPhase('clarify')} onExit={leaveCanvas}
      onAnswer={(a,t,kind)=>openEditor(a,t,kind)}/>;
  if(screen==='editor' && edItem){
    const kind = editor.kind;
    const queue = kind==='action'?openActions(edAuto):openAssets(edAuto);
    const total = kind==='action'?(edAuto.actionRequired||[]).length:(edAuto.forReview||[]).length;
    const idx = queue.findIndex(x=>x.id===edItem.id);
    return <EditorScreen key={edItem.id} automation={edAuto} item={edItem} kind={kind}
      queue={queue} total={total} idx={idx}
      onPrev={()=>setEditor(e=>({...e,itemId:queue[idx-1].id}))}
      onNext={()=>setEditor(e=>({...e,itemId:queue[idx+1].id}))}
      onApprove={approveItem} hint={hint}
      onBack={()=>{setEditor(null);setScreen(canvasId?'canvas':'dashboard');}}/>;
  }

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#fff'}}>
      <AppHeader hint={hint}/>
      <div style={{flex:1,minHeight:0,display:'flex',overflow:'hidden'}}>
        {screen==='home'
          ? <HomeScreen onAutomations={()=>setScreen('dashboard')} onNew={()=>setScreen('new')}
              onPrompt={t=>startCreation({name:titleFromPrompt(t),desc:t,when:'now',schedule:null,repeat:null})}/>
          : <div style={{flex:1,minWidth:0}}><KaiShell onHome={()=>setScreen('home')} onClose={()=>setScreen('home')}>
              {screen!=='new' && <>
                <AutomationsList automations={automations} selectedId={selectedId}
                  onSelect={a=>setSelectedId(a.id)} onNew={()=>setScreen('new')}/>
                {selected && <DetailPanel a={selected}
                  onClose={()=>setSelectedId(null)}
                  onOpen={()=>{
                    if(draft&&selected.id===draft.id) setCanvasId(null);
                    else setCanvasId(selected.id);
                    setScreen('canvas');
                  }}
                  onAnswer={(a,t)=>openEditor(a,t,'action')}
                  onReviewAsset={(a,x)=>openEditor(a,x,'review')}
                  onSync={syncAssets}/>}
              </>}
              {screen==='new' &&
                <NewAutomation onCancel={()=>setScreen('dashboard')} onBuild={startCreation}/>}
            </KaiShell></div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
